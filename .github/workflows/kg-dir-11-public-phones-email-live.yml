name: KG-DIR-11 Kiwi Public Phone and Turnstile Business Email
on:
  pull_request:
    paths:
      - wrangler.jsonc
      - scripts/verify-live-kiwi-business-contacts.mjs
      - .github/workflows/kg-dir-11-public-phones-email-live.yml
  push:
    branches: [main]
    paths:
      - wrangler.jsonc
      - scripts/verify-live-kiwi-business-contacts.mjs
      - .github/workflows/kg-dir-11-public-phones-email-live.yml
permissions:
  contents: read
concurrency:
  group: kg-dir-11-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify source config and protected contact boundaries
        run: |
          set -euo pipefail
          node --check scripts/verify-live-kiwi-business-contacts.mjs
          node --test scripts/check-kiwi-business-contacts.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const a=JSON.parse(readFileSync("wrangler.jsonc","utf8"));
          if(a.vars.BUSINESS_PHONE_PUBLIC_ENABLED!=="true"||
             a.vars.BUSINESS_EMAIL_REVEAL_ENABLED!=="true"||
             a.previews.vars.BUSINESS_PHONE_PUBLIC_ENABLED!=="false"||
             a.previews.vars.BUSINESS_EMAIL_REVEAL_ENABLED!=="false"||
             !a.r2_buckets.some(b=>b.binding==="KIWI_PRIVATE_CONTACTS"&&
              b.bucket_name==="grideater-public-vertical-feeds-v1"))
            throw Error("CONTACT_RELEASE_CONFIG_HOLD");
          console.log("KG_DIR_11_CONTACT_SOURCE_CONFIG=PASS");
          NODE
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check deployed Kiwi Worker business phones and Turnstile email gate
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if node scripts/verify-live-kiwi-business-contacts.mjs; then exit 0; fi
            if [[ "$i" -eq 24 ]]; then exit 1; fi
            sleep 15
          done

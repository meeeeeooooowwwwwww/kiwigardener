name: Verify Kiwi Gardeners static website
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Council news feed selection and relevance
        run: node --test scripts/check-council-news.mjs
      - name: Inspect live Newsline feed for gardening stories
        continue-on-error: true
        run: node scripts/refresh-council-news.mjs
      - name: Build and validate SEO pages
        run: npm run check
      - name: Validate fail-closed GRID EATER public-only feed and gardener directory
        run: node --test scripts/check-gardener-directory.mjs
      - name: Validate source-reviewed public-only supplier pages and correction boundaries
        run: node --test scripts/check-reviewed-supplier-directory.mjs
      - name: Validate first-party gardener editorial without approving protected GRID EATER feed
        run: node --test scripts/check-first-party-gardening-services.mjs
      - name: Validate secure form API and simulated email delivery
        run: node --test scripts/check-contact.mjs
      - name: Install browser automation (use runner's Chrome)
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Test mobile, tablet, desktop and ultrawide layouts
        run: node scripts/check-responsive.mjs

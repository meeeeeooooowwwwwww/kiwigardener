name: KG-DIR-13 Native Source Grade and Contact Proof
on:
  pull_request:
    paths:
      - 'scripts/verify-live-kiwi-grade-153.mjs'
      - 'scripts/check-live-kiwi-grade-153.mjs'
      - '.github/workflows/kg-dir-13-source-grade-live.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-live-kiwi-grade-153.mjs'
      - 'scripts/check-live-kiwi-grade-153.mjs'
      - '.github/workflows/kg-dir-13-source-grade-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test exact 153 source-grade/contact contract with synthetic data
        run: |
          set -euo pipefail
          node --check scripts/verify-live-kiwi-grade-153.mjs
          node --test scripts/check-live-kiwi-grade-153.mjs
  native-readonly:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify live cards and source, never request private contact material
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..16}; do
            if node scripts/verify-live-kiwi-grade-153.mjs; then exit 0; fi
            if [[ "$i" -eq 16 ]]; then exit 1; fi
            sleep 12
          done
